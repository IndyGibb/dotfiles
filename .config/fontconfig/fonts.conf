<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- monospace: DepartureMono first, CJK appended as fallback -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DepartureMono Nerd Font Mono</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>

  <!-- sans-serif: keep a REAL sans first, CJK only as trailing fallback -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <!-- serif: real serif first, CJK trailing -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
